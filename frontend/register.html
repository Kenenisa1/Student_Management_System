<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — JU Student Management</title>
  <meta name="description" content="Create your JU Student Management account as a student or teacher." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 8L6 13l10 5 10-5z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/login.css" />
  <script src="js/theme-toggle.js"></script>
  <style>
    /* Role selector */
    .role-selector { display:flex; gap:12px; margin-bottom:4px; }
    .role-option   { flex:1; }
    .role-option input[type="radio"] { display:none; }
    .role-option label {
      display:flex; align-items:center; gap:10px;
      padding:12px 16px; border-radius:10px;
      border:2px solid var(--border);
      cursor:pointer; font-size:.875rem; font-weight:500;
      transition:border-color .2s, background .2s;
      user-select:none;
    }
    .role-option input:checked + label {
      border-color:var(--primary);
      background:var(--primary-faint, rgba(79,70,229,.07));
      color:var(--primary);
    }
    .role-option label:hover { border-color:var(--primary); }
    .role-icon { font-size:1.25rem; }

    /* Password strength bar */
    .pw-strength { margin-top:6px; }
    .pw-strength-bar { height:4px; border-radius:2px; background:var(--border); overflow:hidden; }
    .pw-strength-fill { height:100%; border-radius:2px; width:0%; transition:width .3s, background .3s; }
    .pw-strength-label { font-size:.75rem; color:var(--text-muted); margin-top:4px; }
  </style>
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a href="login.html" class="logo" aria-label="Back to login">
        <div class="logo-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <span class="logo-text">JU Student Management</span>
      </a>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle" title="Toggle theme" aria-label="Switch theme" type="button">
          <span class="theme-toggle-slider">
            <span class="theme-toggle-icon theme-toggle-icon-sun"><i data-lucide="sun"></i></span>
            <span class="theme-toggle-icon theme-toggle-icon-moon"><i data-lucide="moon"></i></span>
          </span>
        </button>
      </div>
    </div>
  </header>

  <div class="login-bg" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="bg-grid"></div></div>

  <main class="login-main">
    <div class="login-card" style="max-width:460px;">
      <div class="login-logo">
        <div class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
        <span>JU Student Management</span>
      </div>
      <h1 class="login-title">Create an account</h1>
      <p class="login-sub">Join the system — choose your role below</p>

      <div id="form-error" class="form-error" role="alert" aria-live="polite" hidden></div>
      <div id="form-success" class="form-success" role="status" aria-live="polite" hidden style="padding:12px 16px;border-radius:10px;background:rgba(5,150,105,.1);border:1px solid rgba(5,150,105,.3);color:#059669;font-size:.875rem;margin-bottom:16px;"></div>

      <form id="register-form" novalidate>

        <!-- Role Selector -->
        <div class="field-group">
          <label class="field-label">I am a…</label>
          <div class="role-selector">
            <div class="role-option">
              <input type="radio" name="role" id="role-student" value="student" checked />
              <label for="role-student">
                <span class="role-icon"><i data-lucide="graduation-cap"></i></span>
                <div><strong>Student</strong><br><small style="color:var(--text-muted);font-weight:400">Access your courses &amp; grades</small></div>
              </label>
            </div>
            <div class="role-option">
              <input type="radio" name="role" id="role-teacher" value="teacher" />
              <label for="role-teacher">
                <span class="role-icon"><i data-lucide="clipboard-list"></i></span>
                <div><strong>Teacher</strong><br><small style="color:var(--text-muted);font-weight:400">Manage courses &amp; students</small></div>
              </label>
            </div>
          </div>
        </div>

        <!-- Full Name -->
        <div class="field-group">
          <label class="field-label" for="name">Full Name</label>
          <div class="field-wrap">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="name" class="field-input" placeholder="John Doe" autocomplete="name" required />
          </div>
          <span class="field-error" id="name-error"></span>
        </div>

        <!-- Email -->
        <div class="field-group">
          <label class="field-label" for="email">Email address</label>
          <div class="field-wrap">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="email" class="field-input" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <span class="field-error" id="email-error"></span>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label class="field-label" for="password">Password</label>
          <div class="field-wrap">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" class="field-input" placeholder="Min 8 chars, 1 upper, 1 number, 1 symbol" autocomplete="new-password" required />
            <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">
              <svg id="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <!-- Strength indicator -->
          <div class="pw-strength">
            <div class="pw-strength-bar"><div class="pw-strength-fill" id="pw-fill"></div></div>
            <div class="pw-strength-label" id="pw-label"></div>
          </div>
          <span class="field-error" id="pass-error"></span>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          <span class="btn-text">Create Account</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div style="margin-top:20px;text-align:center;font-size:0.875rem;">
        <span style="color:var(--text-secondary)">Already have an account?</span>
        <a href="login.html" style="color:var(--primary);font-weight:600;text-decoration:none;margin-left:4px;">Sign in</a>
      </div>
    </div>
  </main>

  <script src="js/register.js"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>

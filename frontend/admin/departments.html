<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Departments — JU Student Management</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 8L6 13l10 5 10-5z' fill='white'/%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/index.css"/>
  <link rel="stylesheet" href="../css/departments.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
  <link rel="stylesheet" href="../css/auth.css"/>
  <style>html:not(.auth-ready) body { visibility: hidden; }</style>
  <script src="../js/theme-toggle.js"></script>
</head>
<body>

  <!-- SITE-WIDE NAVIGATION HEADER -->
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a href="dashboard.html" class="logo" aria-label="Home">
        <div class="logo-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <span class="logo-text">JU Student Management</span>
      </a>
      <nav class="nav-links" id="nav-links" role="navigation" aria-label="Main navigation">
        <a href="dashboard.html"   class="nav-link "><i data-lucide="bar-chart-2"></i> Dashboard</a>
        <a href="students.html"    class="nav-link admin-only "><i data-lucide="users"></i> Students</a>
        <a href="departments.html" class="nav-link admin-only nav-link--active"><i data-lucide="building"></i> Departments</a>
        <a href="courses.html"     class="nav-link "><i data-lucide="book"></i> Courses</a>
        <a href="reports.html"     class="nav-link admin-only "><i data-lucide="trending-up"></i> Reports</a>
      </nav>
      <div class="header-actions" id="header-actions">
        <button id="theme-toggle" class="theme-toggle" title="Toggle theme" aria-label="Switch theme" type="button">
          <span class="theme-toggle-slider">
            <span class="theme-toggle-icon theme-toggle-icon-sun"><i data-lucide="sun"></i></span>
            <span class="theme-toggle-icon theme-toggle-icon-moon"><i data-lucide="moon"></i></span>
          </span>
        </button>
      </div>
      <button id="landing-hamburger-btn" class="hamburger-btn" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    </div>
  </header>

  <!-- PAGE CONTENT -->
  <main class="app-page-content">

    <div class="page-header">
      <div>
        <h1 class="page-title">Departments</h1>
        <p class="page-sub">Manage academic departments, faculty heads, and course allocations.</p>
      </div>
      <button class="btn-primary" id="add-dept-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Department
      </button>
    </div>

    <div class="dept-summary" id="dept-summary"></div>
    <div class="dept-grid" id="dept-grid"></div>

  </main>

  <!-- ADD / EDIT DEPARTMENT MODAL -->
  <div class="modal-backdrop" id="modal-backdrop" hidden aria-modal="true" role="dialog" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Add New Department</h2>
        <button class="modal-close" id="modal-close" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="dept-form" novalidate>
        <input type="hidden" id="dept-edit-id"/>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="d-name">Department Name <span class="req">*</span></label>
            <input type="text" id="d-name" class="form-input" placeholder="e.g. Computer Science" required/>
            <span class="form-error" id="err-d-name"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="d-head">Department Head <span class="req">*</span></label>
            <input type="text" id="d-head" class="form-input" placeholder="e.g. Dr. Jane Smith" required/>
            <span class="form-error" id="err-d-head"></span>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="d-students">Student Count</label>
              <input type="number" id="d-students" class="form-input" placeholder="0" min="0"/>
            </div>
            <div class="form-group">
              <label class="form-label" for="d-color">Accent Color</label>
              <input type="color" id="d-color" class="form-input color-input" value="#4f46e5"/>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="d-courses">Courses Offered</label>
            <input type="text" id="d-courses" class="form-input" placeholder="e.g. CS101, CS201, CS301"/>
            <span class="form-hint">Comma-separated course codes</span>
          </div>
          <div class="form-group">
            <label class="form-label" for="d-desc">Description</label>
            <textarea id="d-desc" class="form-input form-textarea" placeholder="Brief department description…" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn-primary" id="modal-submit">Save Department</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/departments.js"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login — JU Student Management</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 8L6 13l10 5 10-5z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/index.css" />
  <link rel="stylesheet" href="../css/login.css" />
  <script src="../js/theme-toggle.js"></script>
</head>
<body>
  <!-- SITE-WIDE NAVIGATION HEADER -->
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a href="../main-page/index.html" class="logo" aria-label="Home">
        <div class="logo-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <span class="logo-text">JU Student Management</span>
      </a>
      <div class="header-actions" id="header-actions">
        <button id="theme-toggle" class="theme-toggle" title="Toggle theme" aria-label="Switch theme" type="button">
          <span class="theme-toggle-slider">
            <span class="theme-toggle-icon theme-toggle-icon-sun"><i data-lucide="sun"></i></span>
            <span class="theme-toggle-icon theme-toggle-icon-moon"><i data-lucide="moon"></i></span>
          </span>
        </button>
      </div>
    </div>
  </header>
  <div class="login-bg" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="bg-grid"></div></div>
  <main class="login-main">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
        <span>JU Student Management</span>
      </div>
      <h1 class="login-title">Staff Login</h1>
      <p class="login-sub">Sign in to manage the system</p>
      <div id="form-error" class="form-error" role="alert" aria-live="polite" hidden></div>
      <form id="login-form" novalidate>
        
        <div class="field-group">
          <label class="field-label" for="email">Email address</label>
          <div class="field-wrap">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="email" class="field-input" placeholder="admin@ju.edu" autocomplete="email" required />
          </div>
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="field-group">
          <div class="label-row">
            <label class="field-label" for="password">Password</label>
            <a href="#" class="forgot">Forgot password?</a>
          </div>
          <div class="field-wrap">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" class="field-input" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">
              <svg id="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <span class="field-error" id="pass-error"></span>
        </div>

        <!-- TOTP Step (Hidden initially — shown when admin has 2FA enabled) -->
        <div class="field-group" id="totp-group" style="display: none;">
          <label class="field-label" for="totp">🔒 Authenticator Code (2FA)</label>
          <div class="field-wrap">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="text" id="totp" class="field-input" placeholder="000000" autocomplete="one-time-code" maxlength="6" />
          </div>
          <span class="field-error" id="totp-error"></span>
        </div>

        <label class="check-label"><input type="checkbox" id="remember-me" /><span class="check-box"></span>Remember me for 30 days</label>
        <button type="submit" class="btn-submit" id="submit-btn">
          <span class="btn-text">Sign in to Dashboard</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>
      <div style="margin-top:20px;text-align:center;font-size:0.875rem;">
        <span style="color:var(--text-secondary)">Students login <a href="../login.html" style="color:var(--primary);font-weight:600;text-decoration:none;">here</a></span>
      </div>
    </div>
  </main>
  <!-- auth.js MUST be loaded first so EduAuth.API_BASE is available to admin-login.js -->
  <script src="../js/auth.js"></script>
  <script src="../js/admin-login.js"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard — JU Student Portal</title>
  <meta name="description" content="View your profile, enrolled courses, and grades." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 8L6 13l10 5 10-5z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/index.css" />
  <script src="js/theme-toggle.js"></script>
  <script src="js/auth.js"></script>
  <style>
    html:not(.auth-ready) body { visibility: hidden; }

    /* ── Layout ── */
    body { padding: 0; }
    .student-layout { display:grid; grid-template-columns:280px 1fr; min-height:calc(100vh - 68px); gap:0; margin-top: 68px; }
    @media(max-width:900px){ .student-layout{ grid-template-columns:1fr; } .student-sidebar{ display:none; } }

    /* ── Sidebar ── */
    .student-sidebar {
      background:var(--surface); border-right:1px solid var(--border);
      padding:32px 20px; display:flex; flex-direction:column; gap:6px;
    }
    .sidebar-profile { text-align:center; padding:20px 0 24px; border-bottom:1px solid var(--border); margin-bottom:16px; }
    .sidebar-avatar {
      width:72px; height:72px; border-radius:50%;
      background:linear-gradient(135deg,#4f46e5,#7c3aed);
      display:flex; align-items:center; justify-content:center;
      font-size:1.5rem; font-weight:700; color:#fff; margin:0 auto 12px;
      letter-spacing:.05em;
    }
    .sidebar-name  { font-weight:700; font-size:1rem; }
    .sidebar-role  { font-size:.75rem; color:var(--text-muted); margin-top:2px; letter-spacing:.06em; text-transform:uppercase; }
    .sidebar-email { font-size:.8rem; color:var(--text-secondary); margin-top:6px; word-break:break-all; }

    .sidebar-nav a {
      display:flex; align-items:center; gap:10px; padding:10px 14px;
      border-radius:8px; text-decoration:none; font-size:.875rem; font-weight:500;
      color:var(--text-secondary); transition:background .15s, color .15s;
    }
    .sidebar-nav a:hover, .sidebar-nav a.active {
      background:var(--primary-faint,rgba(79,70,229,.09)); color:var(--primary);
    }
    .sidebar-nav a span.nav-icon { font-size:1.1rem; width:22px; text-align:center; }

    .sidebar-logout {
      margin-top:auto; padding-top:20px; border-top:1px solid var(--border);
    }
    .sidebar-logout button {
      width:100%; padding:10px 14px; border-radius:8px; border:1px solid var(--border);
      background:transparent; cursor:pointer; font-size:.875rem; font-weight:500;
      color:var(--text-secondary); display:flex; align-items:center; gap:8px;
      transition:background .15s, color .15s, border-color .15s;
    }
    .sidebar-logout button:hover { background:#fef2f2; border-color:#fca5a5; color:#dc2626; }

    /* ── Main content ── */
    .student-main { padding:32px; overflow-y:auto; }
    @media(max-width:640px){ .student-main{ padding:20px 16px; } }

    /* ── Section tabs ── */
    .tab-bar { display:flex; gap:4px; border-bottom:2px solid var(--border); margin-bottom:28px; }
    .tab-btn {
      padding:10px 18px; border:none; background:none; cursor:pointer;
      font-size:.875rem; font-weight:600; color:var(--text-secondary);
      border-bottom:2px solid transparent; margin-bottom:-2px;
      transition:color .2s, border-color .2s;
    }
    .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); }
    .tab-pane { display:none; }
    .tab-pane.active { display:block; }

    /* ── Profile section ── */
    .profile-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; }
    .profile-header { display:flex; align-items:center; gap:20px; margin-bottom:24px; }
    .profile-avatar-lg {
      width:88px; height:88px; border-radius:50%; flex-shrink:0;
      background:linear-gradient(135deg,#4f46e5,#7c3aed);
      display:flex; align-items:center; justify-content:center;
      font-size:2rem; font-weight:700; color:#fff; letter-spacing:.05em;
    }
    .profile-info h2 { font-size:1.375rem; font-weight:700; }
    .profile-info p  { color:var(--text-secondary); font-size:.875rem; margin-top:4px; }
    .profile-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:.75rem; font-weight:600; background:rgba(79,70,229,.1); color:#4f46e5; margin-top:6px; }

    .profile-fields { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:560px){ .profile-fields{ grid-template-columns:1fr; } }
    .pf-item label { display:block; font-size:.75rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
    .pf-item input {
      width:100%; padding:10px 14px; border-radius:8px;
      border:1.5px solid var(--border); background:var(--bg);
      color:var(--text); font-size:.875rem; transition:border-color .2s;
    }
    .pf-item input:focus { outline:none; border-color:var(--primary); }
    .pf-item input[readonly] { opacity:.65; cursor:not-allowed; }
    .profile-save { margin-top:20px; display:flex; gap:10px; align-items:center; }

    /* ── Stat bar ── */
    .student-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:28px; }
    @media(max-width:560px){ .student-stats{ grid-template-columns:1fr 1fr; } }
    .s-stat { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
    .s-stat-val { font-size:1.75rem; font-weight:800; color:var(--primary); }
    .s-stat-lbl { font-size:.75rem; color:var(--text-muted); margin-top:3px; }

    /* ── Course cards grid ── */
    .courses-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
    .course-card {
      background:var(--surface); border:1px solid var(--border); border-radius:14px;
      padding:20px; display:flex; flex-direction:column; gap:10px;
      transition:box-shadow .2s, transform .2s;
    }
    .course-card:hover { box-shadow:0 6px 24px rgba(0,0,0,.09); transform:translateY(-2px); }
    .course-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .course-code { font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--primary); background:rgba(79,70,229,.09); padding:3px 8px; border-radius:6px; }
    .course-credits { font-size:.72rem; color:var(--text-muted); }
    .course-name { font-weight:700; font-size:.95rem; line-height:1.35; }
    .course-instructor { font-size:.8rem; color:var(--text-secondary); }
    .course-dept { font-size:.75rem; color:var(--text-muted); }
    .course-grade-row { display:flex; justify-content:space-between; align-items:center; margin-top:6px; padding-top:12px; border-top:1px solid var(--border); }
    .grade-badge {
      display:inline-flex; align-items:center; gap:6px;
      padding:4px 12px; border-radius:8px; font-weight:700; font-size:.875rem;
    }
    .grade-A  { background:#d1fae5; color:#065f46; }
    .grade-B  { background:#dbeafe; color:#1e40af; }
    .grade-C  { background:#fef3c7; color:#92400e; }
    .grade-D  { background:#fee2e2; color:#991b1b; }
    .grade-pending { background:var(--bg); color:var(--text-muted); border:1px solid var(--border); }
    .grade-score { font-size:.8rem; color:var(--text-secondary); }
    .enrolled-on { font-size:.72rem; color:var(--text-muted); }

    /* ── Empty states ── */
    .empty-state { text-align:center; padding:48px 24px; color:var(--text-muted); }
    .empty-state .empty-icon { font-size:3rem; margin-bottom:12px; }
    .empty-state p { font-size:.9rem; }

    /* ── Loading ── */
    .loading-spinner { display:flex; justify-content:center; padding:48px; }
    .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Btn ── */
    .btn-sm { padding:7px 16px; font-size:.8rem; border-radius:8px; font-weight:600; border:none; cursor:pointer; transition:opacity .15s; }
    .btn-sm:hover { opacity:.85; }
    .btn-primary-sm { background:var(--primary); color:#fff; }
    .btn-outline-sm { background:transparent; border:1.5px solid var(--border); color:var(--text-secondary); }
    .save-feedback { font-size:.8rem; color:#059669; display:none; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <div class="logo">
        <div class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
        <span class="logo-text">Student Portal</span>
      </div>
      <div class="header-actions" id="header-actions">
        <button id="theme-toggle" class="theme-toggle" title="Toggle theme" aria-label="Switch theme" type="button">
          <span class="theme-toggle-slider"><span class="theme-toggle-icon theme-toggle-icon-sun"><i data-lucide="sun"></i></span><span class="theme-toggle-icon theme-toggle-icon-moon"><i data-lucide="moon"></i></span></span>
        </button>
      </div>
    </div>
  </header>

  <div class="student-layout">

    <!-- Sidebar -->
    <aside class="student-sidebar">
      <div class="sidebar-profile">
        <div class="sidebar-avatar" id="sb-avatar">?</div>
        <div class="sidebar-name"  id="sb-name">Loading…</div>
        <div class="sidebar-role"  id="sb-role">Student</div>
        <div class="sidebar-email" id="sb-email"></div>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="active" data-tab="overview">
          <span class="nav-icon"><i data-lucide="home"></i></span> Overview
        </a>
        <a href="#" data-tab="courses">
          <span class="nav-icon"><i data-lucide="book"></i></span> My Courses
        </a>
        <a href="#" data-tab="grades">
          <span class="nav-icon"><i data-lucide="bar-chart-2"></i></span> Grades
        </a>
        <a href="#" data-tab="profile">
          <span class="nav-icon"><i data-lucide="user"></i></span> Profile
        </a>
      </nav>
      <div class="sidebar-logout">
        <button onclick="EduAuth.logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log Out
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="student-main">

      <!-- ── Overview tab ── -->
      <div class="tab-pane active" id="pane-overview">
        <div class="page-header" style="margin-bottom:24px;">
          <div>
            <h1 class="page-title">Welcome back, <span id="welcome-name">…</span> 👋</h1>
            <p class="page-sub" id="welcome-date"></p>
          </div>
        </div>

        <div class="student-stats">
          <div class="s-stat">
            <div class="s-stat-val" id="stat-courses">—</div>
            <div class="s-stat-lbl">Enrolled Courses</div>
          </div>
          <div class="s-stat">
            <div class="s-stat-val" id="stat-graded">—</div>
            <div class="s-stat-lbl">Graded Courses</div>
          </div>
          <div class="s-stat">
            <div class="s-stat-val" id="stat-gpa">—</div>
            <div class="s-stat-lbl">Average Score</div>
          </div>
        </div>

        <h2 style="font-size:1.05rem;font-weight:700;margin-bottom:16px;">Recent Courses</h2>
        <div class="courses-grid" id="overview-courses">
          <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- ── Courses tab ── -->
      <div class="tab-pane" id="pane-courses">
        <h1 class="page-title" style="margin-bottom:24px;">My Courses</h1>
        <div class="courses-grid" id="all-courses">
          <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- ── Grades tab ── -->
      <div class="tab-pane" id="pane-grades">
        <h1 class="page-title" style="margin-bottom:24px;">Grades</h1>
        <div id="grades-table-wrap">
          <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- ── Profile tab ── -->
      <div class="tab-pane" id="pane-profile">
        <h1 class="page-title" style="margin-bottom:24px;">My Profile</h1>
        <div class="profile-card">
          <div class="profile-header">
            <div class="profile-avatar-lg" id="profile-avatar">?</div>
            <div class="profile-info">
              <h2 id="profile-fullname">Loading…</h2>
              <p id="profile-email-display"></p>
              <span class="profile-badge"><i data-lucide="graduation-cap"></i> Student</span>
            </div>
          </div>
          <form id="profile-form">
            <div class="profile-fields">
              <div class="pf-item">
                <label>Full Name</label>
                <input type="text" id="profile-name" placeholder="Your full name" autocomplete="name" />
              </div>
              <div class="pf-item">
                <label>Email Address</label>
                <input type="email" id="profile-email" readonly title="Email cannot be changed" />
              </div>
              <div class="pf-item">
                <label>Phone Number</label>
                <input type="tel" id="profile-phone" placeholder="+1 234 567 8900" autocomplete="tel" />
              </div>
              <div class="pf-item">
                <label>Member Since</label>
                <input type="text" id="profile-since" readonly />
              </div>
            </div>
            <div class="profile-save">
              <button type="submit" class="btn-sm btn-primary-sm">Save Changes</button>
              <span class="save-feedback" id="save-feedback">✅ Saved!</span>
            </div>
          </form>
        </div>
      </div>

    </main>
  </div>

  <script src="js/student-dashboard.js"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Portal — JU Student Management</title>
  <meta name="description" content="Manage your courses, view enrolled students, and submit grades." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M16 8L6 13l10 5 10-5z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/index.css" />
  <script src="js/theme-toggle.js"></script>
  <script src="js/auth.js"></script>
  <style>
    html:not(.auth-ready) body { visibility: hidden; }

    /* ── Layout ── */
    body { padding: 0; }
    .teacher-layout { display:grid; grid-template-columns:260px 1fr; min-height:calc(100vh - 68px); margin-top: 68px; }
    @media(max-width:900px){ .teacher-layout{ grid-template-columns:1fr; } .teacher-sidebar{ display:none; } }

    /* ── Sidebar ── */
    .teacher-sidebar {
      background:var(--surface); border-right:1px solid var(--border);
      padding:28px 18px; display:flex; flex-direction:column; gap:6px;
    }
    .sidebar-profile { text-align:center; padding:16px 0 20px; border-bottom:1px solid var(--border); margin-bottom:14px; }
    .sidebar-avatar {
      width:68px; height:68px; border-radius:50%;
      background:linear-gradient(135deg,#7c3aed,#0891b2);
      display:flex; align-items:center; justify-content:center;
      font-size:1.4rem; font-weight:700; color:#fff; margin:0 auto 10px;
    }
    .sidebar-name  { font-weight:700; font-size:.95rem; }
    .sidebar-role  { font-size:.72rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
    .sidebar-email { font-size:.78rem; color:var(--text-secondary); margin-top:5px; word-break:break-all; }

    .sidebar-nav a {
      display:flex; align-items:center; gap:10px; padding:10px 14px;
      border-radius:8px; text-decoration:none; font-size:.875rem; font-weight:500;
      color:var(--text-secondary); transition:background .15s, color .15s;
    }
    .sidebar-nav a:hover, .sidebar-nav a.active { background:rgba(124,58,237,.09); color:#7c3aed; }
    .sidebar-nav a span.nav-icon { width:22px; text-align:center; }

    .sidebar-logout { margin-top:auto; padding-top:18px; border-top:1px solid var(--border); }
    .sidebar-logout button {
      width:100%; padding:10px 14px; border-radius:8px; border:1px solid var(--border);
      background:transparent; cursor:pointer; font-size:.875rem; font-weight:500;
      color:var(--text-secondary); display:flex; align-items:center; gap:8px;
      transition:background .15s, color .15s;
    }
    .sidebar-logout button:hover { background:#fef2f2; border-color:#fca5a5; color:#dc2626; }

    /* ── Main ── */
    .teacher-main { padding:32px; overflow-y:auto; }
    @media(max-width:640px){ .teacher-main{ padding:20px 16px; } }

    /* ── Tabs ── */
    .tab-bar { display:flex; gap:4px; border-bottom:2px solid var(--border); margin-bottom:28px; }
    .tab-btn { padding:10px 18px; border:none; background:none; cursor:pointer; font-size:.875rem; font-weight:600; color:var(--text-secondary); border-bottom:2px solid transparent; margin-bottom:-2px; transition:color .2s,border-color .2s; }
    .tab-btn.active { color:#7c3aed; border-bottom-color:#7c3aed; }
    .tab-pane { display:none; }
    .tab-pane.active { display:block; }

    /* ── Stats ── */
    .t-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:28px; }
    @media(max-width:560px){ .t-stats{ grid-template-columns:1fr 1fr; } }
    .t-stat { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
    .t-stat-val { font-size:1.75rem; font-weight:800; color:#7c3aed; }
    .t-stat-lbl { font-size:.75rem; color:var(--text-muted); margin-top:3px; }

    /* ── Course card ── */
    .course-accordion { display:flex; flex-direction:column; gap:16px; }
    .course-block { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
    .course-block-header {
      display:flex; justify-content:space-between; align-items:center;
      padding:18px 20px; cursor:pointer; gap:16px;
      transition:background .15s;
    }
    .course-block-header:hover { background:rgba(124,58,237,.04); }
    .cbh-left { display:flex; flex-direction:column; gap:4px; }
    .cbh-code { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#7c3aed; background:rgba(124,58,237,.09); padding:2px 8px; border-radius:6px; width:fit-content; }
    .cbh-name { font-weight:700; font-size:1rem; }
    .cbh-meta { font-size:.8rem; color:var(--text-secondary); }
    .cbh-right { display:flex; align-items:center; gap:12px; flex-shrink:0; }
    .enrolled-pill { padding:4px 12px; border-radius:20px; font-size:.8rem; font-weight:600; background:rgba(124,58,237,.08); color:#7c3aed; }
    .expand-icon { font-size:1.1rem; transition:transform .25s; }
    .course-block.open .expand-icon { transform:rotate(180deg); }

    /* ── Students table ── */
    .students-panel { border-top:1px solid var(--border); padding:20px; display:none; }
    .course-block.open .students-panel { display:block; }
    .students-panel h4 { font-size:.875rem; font-weight:700; margin-bottom:14px; }
    .st-table { width:100%; border-collapse:collapse; font-size:.855rem; }
    .st-table th { padding:9px 12px; text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); background:var(--bg); border-bottom:2px solid var(--border); }
    .st-table td { padding:10px 12px; border-bottom:1px solid var(--border); }
    .st-table tr:last-child td { border-bottom:none; }

    /* Grade input */
    .grade-input-wrap { display:flex; gap:6px; align-items:center; }
    .grade-num-input {
      width:70px; padding:5px 8px; border-radius:6px;
      border:1.5px solid var(--border); background:var(--bg);
      color:var(--text); font-size:.855rem; text-align:center;
    }
    .grade-num-input:focus { outline:none; border-color:#7c3aed; }
    .grade-select {
      padding:5px 8px; border-radius:6px; border:1.5px solid var(--border);
      background:var(--bg); color:var(--text); font-size:.855rem;
    }
    .grade-select:focus { outline:none; border-color:#7c3aed; }
    .save-grade-btn {
      padding:5px 12px; border-radius:6px; border:none;
      background:#7c3aed; color:#fff; font-size:.78rem; font-weight:600;
      cursor:pointer; transition:opacity .15s;
    }
    .save-grade-btn:hover { opacity:.85; }
    .grade-saved-msg { font-size:.72rem; color:#059669; display:none; }

    /* ── Profile card ── */
    .profile-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; }
    .profile-header { display:flex; align-items:center; gap:20px; margin-bottom:24px; }
    .profile-avatar-lg { width:88px; height:88px; border-radius:50%; flex-shrink:0; background:linear-gradient(135deg,#7c3aed,#0891b2); display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:700; color:#fff; }
    .profile-info h2 { font-size:1.375rem; font-weight:700; }
    .profile-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:.75rem; font-weight:600; background:rgba(124,58,237,.1); color:#7c3aed; margin-top:6px; }
    .profile-fields { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:560px){ .profile-fields{ grid-template-columns:1fr; } }
    .pf-item label { display:block; font-size:.75rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
    .pf-item input { width:100%; padding:10px 14px; border-radius:8px; border:1.5px solid var(--border); background:var(--bg); color:var(--text); font-size:.875rem; }
    .pf-item input:focus { outline:none; border-color:#7c3aed; }
    .pf-item input[readonly] { opacity:.65; cursor:not-allowed; }

    /* ── Empty / loading ── */
    .empty-state { text-align:center; padding:40px 24px; color:var(--text-muted); }
    .empty-icon { font-size:2.5rem; margin-bottom:10px; }
    .loading-spinner { display:flex; justify-content:center; padding:40px; }
    .spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:#7c3aed; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to{ transform:rotate(360deg); } }
    .btn-sm { padding:7px 16px; font-size:.8rem; border-radius:8px; font-weight:600; border:none; cursor:pointer; }
    .btn-primary-sm { background:#7c3aed; color:#fff; }
    .save-feedback { font-size:.8rem; color:#059669; display:none; margin-left:8px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <div class="logo">
        <div class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
        <span class="logo-text">Teacher Portal</span>
      </div>
      <div class="header-actions" id="header-actions">
        <button id="theme-toggle" class="theme-toggle" title="Toggle theme" aria-label="Switch theme" type="button">
          <span class="theme-toggle-slider"><span class="theme-toggle-icon theme-toggle-icon-sun"><i data-lucide="sun"></i></span><span class="theme-toggle-icon theme-toggle-icon-moon"><i data-lucide="moon"></i></span></span>
        </button>
      </div>
    </div>
  </header>

  <div class="teacher-layout">

    <!-- Sidebar -->
    <aside class="teacher-sidebar">
      <div class="sidebar-profile">
        <div class="sidebar-avatar" id="sb-avatar">?</div>
        <div class="sidebar-name"  id="sb-name">Loading…</div>
        <div class="sidebar-role">Teacher</div>
        <div class="sidebar-email" id="sb-email"></div>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="active" data-tab="overview">
          <span class="nav-icon"><i data-lucide="home"></i></span> Overview
        </a>
        <a href="#" data-tab="courses">
          <span class="nav-icon"><i data-lucide="book"></i></span> My Courses
        </a>
        <a href="#" data-tab="profile">
          <span class="nav-icon"><i data-lucide="user"></i></span> Profile
        </a>
      </nav>
      <div class="sidebar-logout">
        <button onclick="EduAuth.logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log Out
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="teacher-main">

      <!-- Overview -->
      <div class="tab-pane active" id="pane-overview">
        <div class="page-header" style="margin-bottom:24px;">
          <h1 class="page-title">Welcome, <span id="welcome-name">…</span> 👋</h1>
          <p class="page-sub" id="welcome-date"></p>
        </div>
        <div class="t-stats">
          <div class="t-stat"><div class="t-stat-val" id="stat-courses">—</div><div class="t-stat-lbl">Assigned Courses</div></div>
          <div class="t-stat"><div class="t-stat-val" id="stat-students">—</div><div class="t-stat-lbl">Total Students</div></div>
          <div class="t-stat"><div class="t-stat-val" id="stat-graded">—</div><div class="t-stat-lbl">Grades Submitted</div></div>
        </div>
        <h2 style="font-size:1.05rem;font-weight:700;margin-bottom:16px;">Your Courses</h2>
        <div id="overview-courses">
          <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Courses (full detail with students) -->
      <div class="tab-pane" id="pane-courses">
        <h1 class="page-title" style="margin-bottom:24px;">My Courses &amp; Students</h1>
        <div class="course-accordion" id="courses-accordion">
          <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Profile -->
      <div class="tab-pane" id="pane-profile">
        <h1 class="page-title" style="margin-bottom:24px;">My Profile</h1>
        <div class="profile-card">
          <div class="profile-header">
            <div class="profile-avatar-lg" id="profile-avatar">?</div>
            <div class="profile-info">
              <h2 id="profile-fullname">Loading…</h2>
              <p id="profile-email-display" style="color:var(--text-secondary);font-size:.875rem;margin-top:4px;"></p>
              <span class="profile-badge"><i data-lucide="clipboard-list"></i> Teacher</span>
            </div>
          </div>
          <div class="profile-fields">
            <div class="pf-item"><label>Full Name</label><input type="text" id="profile-name" readonly /></div>
            <div class="pf-item"><label>Email Address</label><input type="email" id="profile-email" readonly /></div>
            <div class="pf-item"><label>Department</label><input type="text" id="profile-dept" readonly /></div>
            <div class="pf-item"><label>Member Since</label><input type="text" id="profile-since" readonly /></div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="js/teacher-home.js"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>

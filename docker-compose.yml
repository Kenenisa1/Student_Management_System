version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sms-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Musab@54
      MYSQL_DATABASE: student_management
    ports:
      - "3306:3306"
    volumes:
      - sms-db-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pMusab@54"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sms-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sms-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: Musab@54
      DB_NAME: student_management
      REDIS_URL: redis://redis:6379
      JWT_SECRET: juSMS_super_secret_jwt_key_2026_!@#$%^&*
      JWT_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: sms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  sms-db-data:
  sms-redis-data:
